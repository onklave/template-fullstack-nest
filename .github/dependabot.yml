# Dependabot: grouped weekly updates. This repo has no CI matrix to burn,
# so keeping dependencies and base images current is nearly free.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns:
          - '*'
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns:
          - '*'
    open-pull-requests-limit: 2
