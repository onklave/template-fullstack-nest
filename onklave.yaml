# Onklave deploy manifest — the ONLY deployment contract for this repo.
#
# The platform reads THIS file. It clones the repo, builds each service's image
# in-cluster from that service's own build context and Dockerfile, runs the
# tests, then renders a Deployment, Service and Ingress rule per service.
#
# GitHub Actions is NOT used and NOT consulted. There is deliberately no
# .github/ directory here: a workflow file cannot declare a service, and the
# platform's credential cannot push one.
#
# This repo has TWO services. They are built and deployed SEPARATELY — separate
# images, separate rollouts, separate scaling — and are joined at request time
# by `expose.path` on ONE host:
#
#   https://<app-host>/      -> web  (Angular static bundle, port 3000)
#   https://<app-host>/api   -> api  (NestJS + PostgreSQL, port 8080)
#
# Because they share a host, the browser calls the API same-origin. There is no
# CORS config anywhere in this repo and none is needed.
#
# The route prefix is NOT stripped before it reaches the container, so `api`
# serves real `/api/...` paths — hence healthPath: /api/healthz.
#
# Exactly one service may claim `/`. To add a third (say a worker with no
# ingress), append another entry with expose.enabled: false.
version: 1

# ---------------------------------------------------------------------------
# Governance. Everything from here to `services:` is optional to the platform
# and load-bearing for agents: it is what Onklave inspects before letting one
# operate on this repo. Keep it TRUE — a declaration the code does not honour
# is worse than no declaration.
#
# Names are lowercase, dot-separated (`email.send`). A colon is rejected, so a
# validation step is `e2e`, never `test:e2e`.
# ---------------------------------------------------------------------------

# The architectural surfaces this app has. One: it draws no distinction of its
# own between callers, because its perimeter is the Onklave gate in front of
# the shared host. Adding an `admin` surface means adding a real check in the
# API, not just a word here — see architecture/boundaries.md.
surfaces:
  - public

# Data class -> freshness class. `transactional` data MUST be re-read from the
# authority immediately before a sensitive execute; a cached value must never
# be the evidence that an operation is still valid.
#   items   GET /api/items      a list for a screen
#   item    GET /api/items/:id  read on interaction
#   actions the input to anything ActionExecutor runs
# See architecture/data-freshness.md.
freshness:
  items: display
  item: live
  actions: transactional

# What this app is allowed to do. It must match ACTION_POLICY in
# server/src/app.module.ts, which is what actually enforces it at runtime:
# a capability absent from that table cannot execute, however it is called.
capabilities:
  - email.send

# Operations that need a human. `deploy.production` is a platform operation
# (Shipyard), not an in-app capability, so it has no ACTION_POLICY entry; an
# in-app capability listed here must be `required` in ACTION_POLICY too.
approvals:
  deploy.production: required

# Where an agent starts. AGENTS.md answers the ten orientation questions and
# routes to architecture/ and skills/ rather than restating them.
agent:
  entrypoint: AGENTS.md

# Ordered validation commands. Every step names an npm script that exists in
# one of the services — test/architecture.test.ts asserts that, so a step
# cannot be declared here and quietly run nothing:
#   lint               server: npm run lint       (tsc --noEmit over src + test)
#   typecheck          client: npm run typecheck
#   architecture-test  server: npm run architecture-test
#   test               both:   npm test
#   e2e                server: npm run e2e
#   build              both:   npm run build
# `npm test` in the server is a superset — it runs every suite in test/,
# including the two named separately. They are declared in their own right
# because they answer different questions (do the boundaries hold; does the
# HTTP surface enforce them) and are worth running, and failing, on their own.
validation:
  - lint
  - typecheck
  - architecture-test
  - test
  - e2e
  - build

services:
  - name: web
    build:
      context: client
      dockerfile: client/Dockerfile
    runtime:
      port: 3000
      healthPath: /health
    expose:
      enabled: true
      path: /
    # No `env` block: this service's output ships to the browser, so anything
    # injected here would be public. DATABASE_URL belongs to `api` alone.
  - name: api
    build:
      context: server
      dockerfile: server/Dockerfile
    runtime:
      port: 8080
      healthPath: /api/healthz
    expose:
      enabled: true
      path: /api
    env:
      - name: DATABASE_URL
        required: true
        secret: true
